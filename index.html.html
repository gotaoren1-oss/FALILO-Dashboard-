<!DOCTYPE html>
<html lang="he" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dashboard</title>
<style>
:root{
  --bg1:rgba(16,23,40,.86);--bg2:rgba(5,8,16,.88);
  --line:rgba(255,255,255,.09);
  --txt:#f4f6fb;--dim:#9eabc2;--gold:#e8b765;--gold2:#f6d9a0;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;cursor:none}
body{
  font-family:Roboto,"Segoe UI",Arial,sans-serif;color:var(--txt);
  background:#05070d url("https://images.unsplash.com/photo-1518391846015-55a9cc003b25?q=60&w=1280") center/cover no-repeat fixed;
}
body::before{content:"";position:fixed;inset:0;z-index:0;
  background:radial-gradient(ellipse at 50% 0%,rgba(232,183,101,.10),transparent 55%),linear-gradient(180deg,rgba(2,4,10,.45),rgba(2,4,10,.7))}
#grid{
  position:relative;z-index:1;height:100%;padding:.9vw;gap:.9vw;
  display:grid;grid-template-columns:1fr 1fr 1.35fr;
  grid-template-rows:7vh minmax(0,1fr) minmax(0,1.3fr);
}
.card{
  position:relative;background:linear-gradient(150deg,var(--bg1),var(--bg2));
  border:1px solid var(--line);border-top:1px solid rgba(232,183,101,.35);
  border-radius:.9vw;padding:1.1vw 1.4vw;overflow:hidden;min-height:0;min-width:0;
  box-shadow:0 .8vw 2vw rgba(0,0,0,.45)
}
#ticker{grid-column:1/4;padding:0;border-radius:.7vw}
#heat{grid-column:1/3;padding:0;display:flex;flex-direction:column}
#tvnews{grid-column:3;padding:0;display:flex;flex-direction:column}
.lbl{flex:none;display:flex;align-items:center;gap:.6vw;padding:.55vw 1.1vw;font-size:.8vw;letter-spacing:.28em;color:var(--gold);border-bottom:1px solid var(--line);text-transform:uppercase}
.lbl::before{content:"";width:.45vw;height:.45vw;border-radius:50%;background:var(--gold);box-shadow:0 0 .6vw var(--gold)}
.tvwin{flex:1;min-height:0;overflow:hidden;position:relative}
.tvbox{width:100%;height:100%}
.tvbox>*{display:block;width:100%;height:100%}
/* גלילה אוטומטית של Top Stories */
.scroller{height:260%;animation:pan 80s ease-in-out infinite alternate;will-change:transform}
@keyframes pan{from{transform:translateY(0)}to{transform:translateY(-61.5%)}}

.city{display:flex;flex-direction:column;justify-content:space-between}
.cname{display:flex;align-items:baseline;gap:.8vw;font-size:1vw;letter-spacing:.3em;color:var(--gold);font-weight:600;text-transform:uppercase}
.cname span{font-size:.85vw;letter-spacing:.05em;color:var(--dim);font-weight:400}
.clock{font-size:4.6vw;font-weight:200;line-height:1.05;font-variant-numeric:tabular-nums;margin-top:.3vw;letter-spacing:.02em}
.clock small{font-size:1.9vw;color:var(--gold2);font-weight:300}
.date{font-size:1.1vw;color:var(--dim);margin-top:.1vw}
.now{display:flex;align-items:center;gap:.9vw;border-top:1px solid var(--line);padding-top:.7vw}
.now .ic{font-size:2.9vw;line-height:1}
.now .t{font-size:2.8vw;font-weight:200}
.now .d{font-size:.92vw;color:var(--dim);line-height:1.45}
.now .d b{color:var(--txt);font-weight:500}
.days{display:flex;gap:.4vw;margin-top:.6vw}
.day{flex:1;text-align:center;font-size:.85vw;color:var(--dim);background:rgba(255,255,255,.04);border-radius:.5vw;padding:.35vw .1vw;line-height:1.35}
.day b{display:block;color:var(--txt);font-weight:500}
.day i{font-style:normal;display:block;font-size:1.4vw;line-height:1.3}

#news{display:flex;flex-direction:column;direction:rtl;padding:1.1vw 1.4vw}
.nh{display:flex;justify-content:space-between;align-items:center;direction:ltr;font-size:.8vw;letter-spacing:.28em;color:var(--gold);margin-bottom:.7vw;text-transform:uppercase}
.nh em{font-style:normal;color:var(--dim);letter-spacing:.1em}
.nbody{flex:1;display:flex;gap:1.2vw;min-height:0;transition:opacity .6s}
.nbody.out{opacity:0}
.nimg{width:36%;border-radius:.6vw;object-fit:cover;background:#111;flex:none;align-self:center;max-height:100%;box-shadow:0 .5vw 1.2vw rgba(0,0,0,.5)}
.ntxt{flex:1;min-width:0;display:flex;flex-direction:column;justify-content:center}
.ntitle{font-size:1.8vw;font-weight:700;line-height:1.28;margin-bottom:.7vw}
.ndesc{font-size:1.15vw;color:var(--dim);line-height:1.5;display:-webkit-box;-webkit-line-clamp:5;-webkit-box-orient:vertical;overflow:hidden}
.bar{position:absolute;left:0;bottom:0;height:.2vw;background:linear-gradient(90deg,var(--gold),var(--gold2));width:100%;transform-origin:left;transform:scaleX(0)}
.bar.run{animation:fill var(--dur,30s) linear forwards}
@keyframes fill{to{transform:scaleX(1)}}
#status{position:fixed;right:1vw;bottom:.3vw;font-size:.7vw;color:rgba(255,255,255,.4);z-index:2}
</style>
</head>
<body>
<div id="grid">
  <div id="ticker" class="card"><div class="tvbox" id="tv-ticker"></div></div>

  <div class="card city" id="c-il">
    <div><div class="cname">ישראל <span>קרית גת</span></div><div class="clock"></div><div class="date"></div></div>
    <div><div class="now"></div><div class="days"></div></div>
  </div>

  <div class="card city" id="c-ny">
    <div><div class="cname">New York <span>NYC</span></div><div class="clock"></div><div class="date"></div></div>
    <div><div class="now"></div><div class="days"></div></div>
  </div>

  <div class="card" id="news">
    <div class="nh"><span id="ncount"></span><span>YNET · <em>חדשות</em></span></div>
    <div class="nbody" id="nbody">
      <div class="ntxt"><div class="ntitle" id="ntitle">טוען חדשות…</div><div class="ndesc" id="ndesc"></div></div>
      <img class="nimg" id="nimg" alt="" referrerpolicy="no-referrer" decoding="async" hidden>
    </div>
    <div class="bar" id="nbar"></div>
  </div>

  <div class="card" id="heat"><div class="lbl">S&amp;P 500 · Market Map</div><div class="tvwin"><div class="tvbox" id="tv-heat"></div></div></div>
  <div class="card" id="tvnews"><div class="lbl">Top Stories · Live</div><div class="tvwin"><div class="tvbox scroller" id="tv-news"></div></div></div>
</div>
<div id="status"></div>

<script>
"use strict";
/* ================= הגדרות - אפשר לשנות כאן ================= */
const CFG = {
  cities: [
    {id:"il", tz:"Asia/Jerusalem",   lat:31.61, lon:34.76,  place:"קרית גת"},
    {id:"ny", tz:"America/New_York", lat:40.71, lon:-74.01, place:"ניו יורק"}
  ],
  feeds: ["https://www.ynet.co.il/Integration/StoryRss2.xml"],
  newsRotateSec: 30,      // החלפת כותרת
  dataRefreshMin: 10,     // רענון חדשות ומזג אוויר
  fullReloadHours: 6,     // טעינה מחדש של הדף (מנקה זיכרון)
  tvTicker: true,
  tvHeatmap: true,        // הכי כבד. אפשר לכבות ב-false אם איטי
  tvNews: true,
  tickerSymbols: "FOREXCOM:SPXUSD,FOREXCOM:NSXUSD,FOREXCOM:DJI,BITSTAMP:BTCUSD,BITSTAMP:ETHUSD,AMEX:RSP,INDEX:S5OF"
};

const $ = (s,r=document)=>r.querySelector(s);
const setStatus = t => { $("#status").textContent = t; };

/* ================= שעונים ================= */
const fmt = {};
CFG.cities.forEach(c=>{
  fmt[c.id] = {
    t:new Intl.DateTimeFormat("en-GB",{timeZone:c.tz,hour:"2-digit",minute:"2-digit",second:"2-digit",hour12:false}),
    d:new Intl.DateTimeFormat("he-IL",{timeZone:c.tz,weekday:"long",day:"numeric",month:"long"})
  };
});
let lastDate = {};
function tick(){
  if(document.hidden) return;
  const now = new Date();
  CFG.cities.forEach(c=>{
    const el = $("#c-"+c.id+" .clock");
    const [hm,s] = [fmt[c.id].t.format(now).slice(0,5), fmt[c.id].t.format(now).slice(6)];
    el.innerHTML = hm+"<small>:"+s+"</small>";
    const d = fmt[c.id].d.format(now);
    if(d!==lastDate[c.id]){ $("#c-"+c.id+" .date").textContent = d; lastDate[c.id]=d; }
  });
}
tick(); setInterval(tick,1000);

/* ================= מזג אוויר (Open-Meteo, בלי מפתח) ================= */
const WX = {
  0:["☀️","בהיר"],1:["🌤️","בהיר ברובו"],2:["⛅","מעונן חלקית"],3:["☁️","מעונן"],
  45:["🌫️","ערפל"],48:["🌫️","ערפל"],51:["🌦️","טפטוף"],53:["🌦️","טפטוף"],55:["🌦️","טפטוף"],
  61:["🌧️","גשם קל"],63:["🌧️","גשם"],65:["🌧️","גשם חזק"],66:["🌧️","גשם קפוא"],67:["🌧️","גשם קפוא"],
  71:["🌨️","שלג קל"],73:["🌨️","שלג"],75:["❄️","שלג כבד"],77:["🌨️","גרגרי שלג"],
  80:["🌦️","ממטרים"],81:["🌧️","ממטרים"],82:["⛈️","ממטרים חזקים"],
  85:["🌨️","ממטרי שלג"],86:["🌨️","ממטרי שלג"],95:["⛈️","סופת רעמים"],96:["⛈️","סופת רעמים וברד"],99:["⛈️","סופת רעמים וברד"]
};
const wx = c => WX[c] || ["🌡️","—"];
const dayFmt = new Intl.DateTimeFormat("he-IL",{weekday:"short",timeZone:"UTC"});

async function loadWeather(c){
  const u = "https://api.open-meteo.com/v1/forecast?latitude="+c.lat+"&longitude="+c.lon+
    "&current=temperature_2m,apparent_temperature,weather_code,wind_speed_10m"+
    "&daily=weather_code,temperature_2m_max,temperature_2m_min,precipitation_probability_max,sunrise,sunset,uv_index_max"+
    "&timezone=auto&forecast_days=5";
  const r = await fetch(u); if(!r.ok) throw new Error("wx "+r.status);
  const j = await r.json(), cur = j.current, dl = j.daily, w = wx(cur.weather_code);
  const root = $("#c-"+c.id);
  root.querySelector(".now").innerHTML =
    '<div class="ic">'+w[0]+'</div><div class="t">'+Math.round(cur.temperature_2m)+'°</div>'+
    '<div class="d"><b>'+c.place+'</b> · '+w[1]+'<br>מרגיש '+Math.round(cur.apparent_temperature)+'° · רוח '+Math.round(cur.wind_speed_10m)+' קמ"ש<br>'+
    '🌅 '+dl.sunrise[0].slice(11,16)+' · 🌇 '+dl.sunset[0].slice(11,16)+' · UV '+Math.round(dl.uv_index_max[0])+'</div>';
  root.querySelector(".days").innerHTML = dl.time.map((d,i)=>
    '<div class="day"><b>'+dayFmt.format(new Date(d+"T00:00:00Z"))+'</b><i>'+wx(dl.weather_code[i])[0]+'</i>'+
    Math.round(dl.temperature_2m_max[i])+'° / '+Math.round(dl.temperature_2m_min[i])+'°<br>💧'+(dl.precipitation_probability_max[i]||0)+'%</div>'
  ).join("");
}
async function refreshWeather(){
  for(const c of CFG.cities){ try{ await loadWeather(c); }catch(e){ setStatus("מזג אוויר: שגיאה, ינסה שוב"); } }
}

/* ================= חדשות מתחלפות (RSS) ================= */
let items = [], idx = 0, rotTimer = null;
const strip = h => { const d=document.createElement("div"); d.innerHTML=h||""; return (d.textContent||"").replace(/\s+/g," ").trim(); };

async function fetchFeed(url){
  try{ // דרך 1: rss2json
    const r = await fetch("https://api.rss2json.com/v1/api.json?rss_url="+encodeURIComponent(url));
    const j = await r.json();
    if(j.status==="ok") return j.items.map(i=>({
      title:strip(i.title), desc:strip(i.description).slice(0,320),
      img:i.thumbnail || (i.enclosure&&i.enclosure.link) || (/<img[^>]+src="([^"]+)"/.exec(i.description)||[])[1] || ""
    }));
  }catch(e){}
  // דרך 2 (גיבוי): allorigins + פענוח XML
  const r2 = await fetch("https://api.allorigins.win/raw?url="+encodeURIComponent(url));
  const xml = new DOMParser().parseFromString(await r2.text(),"text/xml");
  return [...xml.querySelectorAll("item")].map(i=>{
    const dsc = i.querySelector("description")?.textContent||"";
    return {title:strip(i.querySelector("title")?.textContent), desc:strip(dsc).slice(0,320),
      img:(/<img[^>]+src="([^"]+)"/.exec(dsc)||[])[1]||i.querySelector("enclosure")?.getAttribute("url")||""};
  });
}
async function refreshNews(){
  try{
    const all = (await Promise.all(CFG.feeds.map(fetchFeed))).flat().filter(x=>x.title);
    if(all.length){ items = all.slice(0,20); if(idx>=items.length) idx=0; if(!rotTimer) startRotation(); }
    setStatus("עודכן "+new Date().toLocaleTimeString("he-IL",{hour:"2-digit",minute:"2-digit"}));
  }catch(e){ setStatus("חדשות: אין חיבור, ינסה שוב"); }
}
function showNews(){
  if(!items.length) return;
  const it = items[idx], body = $("#nbody"), bar = $("#nbar"), img = $("#nimg");
  body.classList.add("out");
  setTimeout(()=>{
    $("#ntitle").textContent = it.title;
    $("#ndesc").textContent = it.desc;
    if(it.img){ img.src = it.img; img.hidden = false; img.onerror = ()=>{img.hidden=true}; } else img.hidden = true;
    $("#ncount").textContent = (idx+1)+" / "+items.length;
    body.classList.remove("out");
    bar.classList.remove("run"); void bar.offsetWidth;
    bar.style.setProperty("--dur",CFG.newsRotateSec+"s"); bar.classList.add("run");
  },600);
}
function startRotation(){
  showNews();
  rotTimer = setInterval(()=>{ if(document.hidden||!items.length) return; idx=(idx+1)%items.length; showNews(); }, CFG.newsRotateSec*1000);
}

/* ================= ווידג'טים של TradingView (נטענים בהדרגה) ================= */
function loadTV(script, html, boxId, delay){
  setTimeout(()=>{
    const s = document.createElement("script");
    s.type = "module"; s.src = "https://widgets.tradingview-widget.com/w/en/"+script+".js";
    s.onload = ()=>{ $("#"+boxId).innerHTML = html; };
    document.head.appendChild(s);
  },delay);
}
window.addEventListener("load",()=>{
  if(CFG.tvTicker)  loadTV("tv-ticker-tape",'<tv-ticker-tape theme="dark" symbols="'+CFG.tickerSymbols+'"></tv-ticker-tape>',"tv-ticker",1500);
  if(CFG.tvHeatmap) loadTV("tv-heatmap",'<tv-heatmap theme="dark" heatmap-type="stock" data-source="SPX500" grouping="sector" block-size="market_cap_basic" block-color="change"></tv-heatmap>',"tv-heat",5000);
  if(CFG.tvNews)    loadTV("tv-news-feed",'<tv-news-feed theme="dark"></tv-news-feed>',"tv-news",9000);
});
if(!CFG.tvTicker) $("#ticker").style.display="none";
if(!CFG.tvHeatmap) $("#heat").style.display="none";
if(!CFG.tvNews) $("#tvnews").style.display="none";

/* ================= רענון אוטומטי ================= */
refreshWeather(); refreshNews();
setInterval(()=>{ if(!document.hidden){ refreshWeather(); refreshNews(); } }, CFG.dataRefreshMin*60000);
document.addEventListener("visibilitychange",()=>{ if(!document.hidden){ tick(); refreshNews(); } });
setTimeout(()=>location.reload(), CFG.fullReloadHours*3600000);
</script>
</body>
</html>
