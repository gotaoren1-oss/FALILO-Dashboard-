<!DOCTYPE html>
<html lang="he" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dashboard</title>
<style>
:root{
  --u:1vw;
  --bg1:rgba(16,23,40,.86);--bg2:rgba(5,8,16,.88);
  --line:rgba(255,255,255,.09);
  --txt:#f4f6fb;--dim:#9eabc2;--gold:#ffc61a;--gold2:#ffe49a;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;cursor:none}
body{
  font-family:"Helvetica Neue",Helvetica,Roboto,Arial,sans-serif;color:var(--txt);
  background:#05070d url("https://images.unsplash.com/photo-1518391846015-55a9cc003b25?q=60&w=1280") center/cover no-repeat fixed;
}
body::before{content:"";position:fixed;inset:0;z-index:0;
  background:radial-gradient(ellipse at 50% 0%,rgba(255,198,26,.10),transparent 55%),linear-gradient(180deg,rgba(2,4,10,.45),rgba(2,4,10,.7))}
#grid{
  position:absolute;inset:0;margin:auto;z-index:1;width:calc(100*var(--u));height:calc(56.25*var(--u));padding:calc(.9*var(--u));gap:calc(.9*var(--u));
  display:grid;grid-template-columns:1fr 1fr 1.35fr;
  grid-template-rows:calc(3.94*var(--u)) minmax(0,1.2fr) minmax(0,1fr);
}
.card{
  position:relative;background:linear-gradient(150deg,var(--bg1),var(--bg2));
  border:1px solid var(--line);border-top:1px solid rgba(255,198,26,.4);
  border-radius:calc(.9*var(--u));padding:calc(1.1*var(--u)) calc(1.4*var(--u));overflow:hidden;min-height:0;min-width:0;
  box-shadow:0 calc(.8*var(--u)) calc(2*var(--u)) rgba(0,0,0,.45)
}
#ticker{grid-column:1/4;padding:0;border-radius:calc(.7*var(--u))}
#heat{grid-column:1/3;padding:0;display:flex;flex-direction:column}
#tvnews{grid-column:3;direction:ltr}
.lbl{flex:none;display:flex;align-items:center;gap:calc(.6*var(--u));padding:calc(.55*var(--u)) calc(1.1*var(--u));font-size:calc(.8*var(--u));letter-spacing:.28em;color:var(--gold);border-bottom:1px solid var(--line);text-transform:uppercase}
.lbl::before{content:"";width:calc(.45*var(--u));height:calc(.45*var(--u));border-radius:50%;background:var(--gold);box-shadow:0 0 calc(.6*var(--u)) var(--gold)}
.tvwin{flex:1;min-height:0;overflow:hidden;position:relative}
.tvbox{width:100%;height:100%}
.tvbox>*{display:block;width:100%;height:100%}
/* גלילה אוטומטית של Top Stories */
.scroller{height:260%;animation:pan 80s ease-in-out infinite alternate;will-change:transform}
@keyframes pan{from{transform:translateY(0)}to{transform:translateY(-61.5%)}}

.city{display:flex;flex-direction:column;justify-content:space-between}
.cname{display:flex;align-items:baseline;gap:calc(.8*var(--u));font-size:calc(1*var(--u));letter-spacing:.3em;color:var(--gold);font-weight:600;text-transform:uppercase}
.cname span{font-size:calc(.85*var(--u));letter-spacing:.05em;color:var(--dim);font-weight:400}
.clock{font-size:calc(4.1*var(--u));font-weight:200;line-height:1.05;font-variant-numeric:tabular-nums;margin-top:calc(.3*var(--u));letter-spacing:.02em}
.clock small{font-size:calc(1.9*var(--u));color:var(--gold2);font-weight:300}
.date{font-size:calc(1.1*var(--u));color:var(--dim);margin-top:calc(.1*var(--u))}
.now{display:flex;align-items:center;gap:calc(.9*var(--u));border-top:1px solid var(--line);padding-top:calc(.7*var(--u))}
.now .ic{font-size:calc(2.9*var(--u));line-height:1}
.now .t{font-size:calc(2.8*var(--u));font-weight:200}
.now .d{font-size:calc(.92*var(--u));color:var(--dim);line-height:1.45}
.now .d b{color:var(--txt);font-weight:500}
.days{display:flex;gap:calc(.4*var(--u));margin-top:calc(.6*var(--u))}
.day{flex:1;text-align:center;font-size:calc(.85*var(--u));color:var(--dim);background:rgba(255,255,255,.04);border-radius:calc(.5*var(--u));padding:calc(.35*var(--u)) calc(.1*var(--u));line-height:1.35}
.day b{display:block;color:var(--txt);font-weight:500}
.day i{font-style:normal;display:block;font-size:calc(1.4*var(--u));line-height:1.3}

.ncard{display:flex;flex-direction:column;padding:calc(1.1*var(--u)) calc(1.4*var(--u))}
.nh{display:flex;justify-content:space-between;align-items:center;direction:ltr;font-size:calc(.8*var(--u));letter-spacing:.28em;color:var(--gold);margin-bottom:calc(.7*var(--u));text-transform:uppercase}
.nh em{font-style:normal;color:var(--dim);letter-spacing:.1em}
.nbody{flex:1;display:flex;gap:calc(1.2*var(--u));min-height:0;transition:opacity .6s}
.nbody.out{opacity:0}
.nimg{width:36%;border-radius:calc(.6*var(--u));object-fit:cover;background:#111;flex:none;align-self:center;max-height:100%;box-shadow:0 calc(.5*var(--u)) calc(1.2*var(--u)) rgba(0,0,0,.5)}
.ntxt{flex:1;min-width:0;display:flex;flex-direction:column;justify-content:center}
.ntitle{font-size:calc(1.8*var(--u));font-weight:700;line-height:1.28;margin-bottom:calc(.7*var(--u))}
.ndesc{font-size:calc(1.15*var(--u));color:var(--dim);line-height:1.5;display:-webkit-box;-webkit-line-clamp:5;-webkit-box-orient:vertical;overflow:hidden}
.bar{position:absolute;left:0;bottom:0;height:calc(.2*var(--u));background:linear-gradient(90deg,var(--gold),var(--gold2));width:100%;transform-origin:left;transform:scaleX(0)}
.bar.run{animation:fill var(--dur,30s) linear forwards}
@keyframes fill{to{transform:scaleX(1)}}
#status{position:fixed;right:calc(1*var(--u));bottom:calc(.3*var(--u));font-size:calc(.7*var(--u));color:rgba(255,255,255,.4);z-index:2}
@supports (width:min(1px,2px)){:root{--u:min(1vw,1.7778vh)}}
#news{direction:rtl}
.ntitle{display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden}

/* ===== New York vibe ===== */
.bul{display:inline-flex;align-items:center;justify-content:center;flex:none;width:calc(1.55*var(--u));height:calc(1.55*var(--u));border-radius:50%;font-weight:700;font-size:calc(.95*var(--u));color:#fff;letter-spacing:0;line-height:1}
.lbl::before{display:none}
.lbl .bul{width:calc(1.3*var(--u));height:calc(1.3*var(--u));font-size:calc(.8*var(--u))}
.sign{background:#0e6b43;border:calc(.13*var(--u)) solid #fff;border-radius:calc(.35*var(--u));padding:calc(.15*var(--u)) calc(.8*var(--u));color:#fff;letter-spacing:.22em;font-weight:700}
.nyse{margin-inline-start:auto;font-size:calc(.75*var(--u));letter-spacing:.14em;padding:calc(.15*var(--u)) calc(.7*var(--u));border-radius:99px;border:1px solid currentColor;font-weight:600}
.nyse.on{color:#35d07f}.nyse.off{color:#ff7b7b}
#c-ny{isolation:isolate}
#c-ny::before{content:"";position:absolute;z-index:-1;right:0;bottom:0;width:62%;height:58%;background:url("data:image/svg+xml,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20viewBox='0%200%20400%20120'%20fill='white'%3E%3Crect%20x='0'%20y='80'%20width='30'%20height='40'/%3E%3Crect%20x='30'%20y='60'%20width='25'%20height='60'/%3E%3Crect%20x='55'%20y='70'%20width='20'%20height='50'/%3E%3Crect%20x='75'%20y='50'%20width='30'%20height='70'/%3E%3Crect%20x='105'%20y='75'%20width='25'%20height='45'/%3E%3Crect%20x='140'%20y='50'%20width='50'%20height='70'/%3E%3Crect%20x='150'%20y='30'%20width='30'%20height='20'/%3E%3Crect%20x='158'%20y='14'%20width='14'%20height='16'/%3E%3Crect%20x='164.5'%20y='0'%20width='3'%20height='14'/%3E%3Crect%20x='200'%20y='65'%20width='25'%20height='55'/%3E%3Crect%20x='225'%20y='40'%20width='28'%20height='80'/%3E%3Crect%20x='260'%20y='45'%20width='26'%20height='75'/%3E%3Crect%20x='271.5'%20y='5'%20width='2'%20height='10'/%3E%3Crect%20x='295'%20y='70'%20width='30'%20height='50'/%3E%3Crect%20x='325'%20y='55'%20width='22'%20height='65'/%3E%3Crect%20x='347'%20y='78'%20width='25'%20height='42'/%3E%3Crect%20x='372'%20y='62'%20width='28'%20height='58'/%3E%3Cpolygon%20points='260%2C45%20273%2C15%20286%2C45'/%3E%3C/svg%3E") right bottom/contain no-repeat;opacity:.12;pointer-events:none}
#ticker{box-shadow:0 0 calc(1.3*var(--u)) rgba(255,198,26,.28),0 calc(.8*var(--u)) calc(2*var(--u)) rgba(0,0,0,.45)}
.hdate{font-size:calc(1.05*var(--u));color:var(--gold2);margin-top:calc(.05*var(--u));unicode-bidi:plaintext}
.occ{display:flex;flex-wrap:wrap;gap:calc(.4*var(--u));margin-top:calc(.4*var(--u));min-height:calc(1.7*var(--u))}
.chip{unicode-bidi:plaintext;font-size:calc(.82*var(--u));padding:calc(.15*var(--u)) calc(.7*var(--u));border-radius:99px;border:1px solid rgba(255,255,255,.2);color:var(--dim);white-space:nowrap}
.chip.now{color:#111;background:var(--gold);border-color:var(--gold);font-weight:700}
.date,.hdate{direction:rtl;text-align:left;unicode-bidi:plaintext}
.chip{direction:rtl}

/* ===== Custom Asset Cards Grid (#heat replacement) ===== */
.asset-grid {
  display: grid;
  grid-template-columns: repeat(5, 1fr);
  gap: calc(.7*var(--u));
  flex: 1;
  padding: calc(.8*var(--u));
  align-content: center;
}
.asset-card {
  background: rgba(255, 255, 255, 0.03);
  border: 1px solid var(--line);
  border-radius: calc(.6*var(--u));
  padding: calc(.7*var(--u)) calc(.5*var(--u));
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  text-align: center;
  transition: background .2s, border-color .2s;
}
.asset-card:hover {
  background: rgba(255, 255, 255, 0.07);
  border-color: rgba(255, 198, 26, 0.4);
}
.asset-symbol {
  font-size: calc(.85*var(--u));
  font-weight: 700;
  letter-spacing: .15em;
  color: var(--gold);
  margin-bottom: calc(.2*var(--u));
}
.asset-price {
  font-size: calc(1.15*var(--u));
  font-weight: 600;
  color: var(--txt);
  font-variant-numeric: tabular-nums;
  margin-bottom: calc(.15*var(--u));
}
.asset-change {
  font-size: calc(.78*var(--u));
  font-weight: 500;
  padding: calc(.1*var(--u)) calc(.4*var(--u));
  border-radius: calc(.3*var(--u));
}
.asset-change.positive { color: #35d07f; background: rgba(53, 208, 127, 0.1); }
.asset-change.negative { color: #ff7b7b; background: rgba(255, 123, 123, 0.1); }
.asset-change.neutral { color: var(--dim); background: rgba(255, 255, 255, 0.05); }
</style>
</head>
<body>
<div id="grid">
  <div id="ticker" class="card"><div class="tvbox" id="tv-ticker"></div></div>

  <div class="card city" id="c-il">
    <div><div class="cname">ישראל <span>קרית גת</span></div><div class="clock"></div><div class="date"></div><div class="hdate"></div><div class="occ"></div></div>
    <div><div class="now"></div><div class="days"></div></div>
  </div>

  <div class="card city" id="c-ny">
    <div><div class="cname"><span class="bul" style="background:#fccc0a;color:#000">N</span><span class="sign">NEW YORK</span><span class="nyse" id="nyse"></span></div><div class="clock"></div><div class="date"></div><div class="occ"></div></div>
    <div><div class="now"></div><div class="days"></div></div>
  </div>

  <div class="card ncard" id="news">
    <div class="nh"><span class="ncount"></span><span class="nsrc">YNET · חדשות</span></div>
    <div class="nbody">
      <div class="ntxt"><div class="ntitle">טוען…</div><div class="ndesc"></div></div>
      <img class="nimg" alt="" referrerpolicy="no-referrer" decoding="async" hidden>
    </div>
    <div class="bar"></div>
  </div>

  <!-- Replaced Market Map with Custom Assets Banner -->
  <div class="card" id="heat">
    <div class="lbl"><span class="bul" style="background:#0039a6">M</span>KEY ASSETS MONITOR</div>
    <div class="asset-grid" id="assetGrid">
      <!-- Populated dynamically via script -->
    </div>
  </div>

  <div class="card ncard" id="tvnews">
    <div class="nh"><span class="ncount"></span><span class="nsrc">TOP STORIES · LIVE</span></div>
    <div class="nbody">
      <div class="ntxt"><div class="ntitle">טוען…</div><div class="ndesc"></div></div>
      <img class="nimg" alt="" referrerpolicy="no-referrer" decoding="async" hidden>
    </div>
    <div class="bar"></div>
  </div>
</div>
<div id="status"></div>

<script>
"use strict";
/* ================= הגדרות ================= */
const CFG = {
  cities: [
    {id:"il", tz:"Asia/Jerusalem",   lat:31.61, lon:34.76,  place:"קרית גת"},
    {id:"ny", tz:"America/New_York", lat:40.71, lon:-74.01, place:"ניו יורק"}
  ],
  newsFeeds: [{url:"https://www.ynet.co.il/Integration/StoryRss2.xml", name:"YNET · חדשות"}],
  topFeeds: [
    {url:"https://search.cnbc.com/rs/search/combinedcms/view.xml?partnerId=wrss01&id=100003114", name:"CNBC"},
    {url:"https://finance.yahoo.com/news/rssindex", name:"YAHOO FINANCE"},
    {url:"https://www.coindesk.com/arc/outboundfeeds/rss/", name:"COINDESK"}
  ],
  topRotateSec: 25,
  newsRotateSec: 30,
  dataRefreshMin: 10,
  fullReloadHours: 6,
  tvTicker: true,
  customAssetsBanner: true,
  tickerSymbols: [
    {proName:"FOREXCOM:SPXUSD", title:"S&P 500"},
    {proName:"FOREXCOM:NSXUSD", title:"Nasdaq 100"},
    {proName:"FOREXCOM:DJI",    title:"Dow 30"},
    {proName:"AMEX:RSP",        title:"S&P Equal Wt"},
    {proName:"FX_IDC:USDILS",   title:"USD/ILS"},
    {proName:"BITSTAMP:BTCUSD", title:"Bitcoin"},
    {proName:"BITSTAMP:ETHUSD", title:"Ethereum"},
    {proName:"TVC:GOLD",        title:"Gold"},
    {proName:"TVC:USOIL",       title:"Oil"}
  ],
  // Exact requested assets list with TradingView symbol mappings
  customAssets: [
    { symbol: "VIX", name: "CBOE Volatility Index", proName: "TVC:VIX" },
    { symbol: "US30", name: "Dow Jones Industrial Average", proName: "FOREXCOM:DJI" },
    { symbol: "DXY", name: "US Dollar Index", proName: "TVC:DXY" },
    { symbol: "S5FI", name: "S&P 500 Financials Sector", proName: "SP:S5FI" },
    { symbol: "TOTAL", name: "Total Crypto Market Cap", proName: "CRYPTOCAP:TOTAL" }
  ]
};

const $ = (s,r=document)=>r.querySelector(s);
const setStatus = t => { $("#status").textContent = t; };

/* ================= שעונים ================= */
const fmt = {};
CFG.cities.forEach(c=>{
  fmt[c.id] = {
    t:new Intl.DateTimeFormat("en-GB",{timeZone:c.tz,hour:"2-digit",minute:"2-digit",second:"2-digit",hour12:false}),
    d:new Intl.DateTimeFormat("he-IL",{timeZone:c.tz,weekday:"long",day:"numeric",month:"long",year:"numeric"}),
    y:new Intl.DateTimeFormat("en-CA",{timeZone:c.tz,year:"numeric",month:"2-digit",day:"2-digit"})
  };
});

/* ================= תאריכים ומועדים ================= */
const hebL = new Intl.DateTimeFormat("en-u-ca-hebrew",{timeZone:"UTC",day:"numeric",month:"long"});
const hebF = new Intl.DateTimeFormat("he-IL-u-ca-hebrew",{timeZone:"UTC",day:"numeric",month:"long",year:"numeric"});
function hd(dt){
  const p={}; hebL.formatToParts(dt).forEach(x=>{p[x.type]=x.value});
  const n=p.month.toLowerCase().replace(/[^a-z]/g,""); let m=n;
  if(n==="adari") m="adar1"; else if(n.indexOf("adar")===0) m="adar";
  else if(n.indexOf("tish")===0) m="tishri"; else if(/^c?hesh/.test(n)) m="heshvan";
  else if(n.indexOf("kis")===0) m="kislev"; else if(n.indexOf("tev")===0) m="tevet";
  else if(n.indexOf("sh")===0) m="shevat"; else if(n.indexOf("nis")===0) m="nisan";
  else if(n.indexOf("iy")===0) m="iyar"; else if(n.indexOf("siv")===0) m="sivan";
  else if(n.indexOf("tam")===0) m="tamuz"; else if(n.indexOf("av")===0) m="av"; else if(n.indexOf("el")===0) m="elul";
  return {d:+p.day, m, w:dt.getUTCDay()};
}
const atz = h => h.m==="iyar" && ((h.d===5&&[0,2,3,4].indexOf(h.w)>-1)||(h.d===4&&h.w===4)||(h.d===3&&h.w===4)||(h.d===6&&h.w===2));
function jewish(dt){
  const h=hd(dt), d=h.d, m=h.m, w=h.w, o=[], D=864e5;
  if(m==="tishri"){
    if(d===1)o.push("ראש השנה"); if(d===2)o.push("ראש השנה · יום ב׳");
    if((d===3&&w!==6)||(d===4&&w===0))o.push("צום גדליה");
    if(d===9)o.push("ערב יום כיפור"); if(d===10)o.push("יום כיפור");
    if(d===14)o.push("ערב סוכות"); if(d===15)o.push("סוכות");
    if(d>=16&&d<=20)o.push("חול המועד סוכות"); if(d===21)o.push("הושענא רבה");
    if(d===22)o.push("שמיני עצרת · שמחת תורה");
  }
  if((m==="kislev"&&d>=25)||(m==="tevet"&&d<=3)){
    for(let j=0;j<8;j++){ const x=hd(new Date(dt.getTime()-j*D)); if(x.m==="kislev"&&x.d===25){ o.push("חנוכה · יום "+(j+1)); break; } }
  }
  if(m==="tevet"&&d===10)o.push("עשרה בטבת");
  if(m==="shevat"&&d===15)o.push("ט״ו בשבט");
  if(m==="adar"){
    if((d===13&&w!==6)||(d===11&&w===4))o.push("תענית אסתר");
    if(d===14)o.push("פורים"); if(d===15)o.push("שושן פורים");
  }
  if(m==="nisan"){
    if(d===14)o.push("ערב פסח"); if(d===15)o.push("פסח");
    if(d>=16&&d<=20)o.push("חול המועד פסח"); if(d===21)o.push("שביעי של פסח");
    if((d===27&&w!==5&&w!==0)||(d===26&&w===4)||(d===28&&w===1))o.push("יום השואה");
  }
  if(m==="iyar"){
    if(atz(h))o.push("יום העצמאות"); else if(atz(hd(new Date(dt.getTime()+D))))o.push("יום הזיכרון");
    if(d===18)o.push("ל״ג בעומר"); if(d===28)o.push("יום ירושלים");
  }
  if(m==="sivan"){ if(d===5)o.push("ערב שבועות"); if(d===6)o.push("שבועות"); }
  if(m==="tamuz"&&((d===17&&w!==6)||(d===18&&w===0)))o.push("י״ז בתמוז");
  if(m==="av"&&((d===9&&w!==6)||(d===10&&w===0)))o.push("תשעה באב");
  if(m==="elul"&&d===29)o.push("ערב ראש השנה");
  if((d===1&&m!=="tishri")||d===30)o.push("ראש חודש");
  return o;
}
const usCache={};
function usMap(y){
  if(usCache[y]) return usCache[y];
  const M={}, add=(m,d,n,x)=>{M[m+"-"+d]={n:n,x:x}};
  const nth=(m,wd,k)=>1+((wd-new Date(Date.UTC(y,m-1,1)).getUTCDay()+7)%7)+7*(k-1);
  const last=(m,wd)=>{ const L=new Date(Date.UTC(y,m,0)).getUTCDate(); return L-((new Date(Date.UTC(y,m-1,L)).getUTCDay()-wd+7)%7); };
  add(1,1,"ראש השנה האזרחית",1); add(1,nth(1,1,3),"יום מרטין לותר קינג",1); add(2,14,"יום האהבה"); add(2,nth(2,1,3),"יום הנשיאים",1); add(3,17,"יום פטריק הקדוש");
  const a=y%19,b=Math.floor(y/100),c=y%100,dd=Math.floor(b/4),e=b%4,f=Math.floor((b+8)/25),g=Math.floor((b-f+1)/3),h=(19*a+b-dd-g+15)%30,i=Math.floor(c/4),k=c%4,l=(32+2*e+2*i-h-k)%7,mm=Math.floor((a+11*h+22*l)/451),em=Math.floor((h+l-7*mm+114)/31),ed=((h+l-7*mm+114)%31)+1;
  add(em,ed,"פסחא"); const gf=new Date(Date.UTC(y,em-1,ed-2)); add(gf.getUTCMonth()+1,gf.getUTCDate(),"יום שישי הטוב",1);
  add(5,nth(5,0,2),"יום האם"); add(5,last(5,1),"יום הזיכרון (ארה״ב)",1); add(6,19,"ג׳ונטינת׳",1); add(6,nth(6,0,3),"יום האב"); add(7,4,"יום העצמאות (ארה״ב)",1);
  add(9,nth(9,1,1),"יום העבודה",1); add(10,nth(10,1,2),"יום קולומבוס"); add(10,31,"ליל כל הקדושים"); add(11,11,"יום הוותיקים");
  if(y%2===0) add(11,nth(11,1,1)+1,"יום הבחירות");
  const th=nth(11,4,4); add(11,th,"חג ההודיה",1); add(11,th+1,"בלאק פריידיי"); add(12,24,"ערב חג המולד"); add(12,25,"חג המולד",1); add(12,31,"ערב ראש השנה האזרחית");
  return (usCache[y]=M);
}
function usOcc(dt){ const H=usMap(dt.getUTCFullYear())[(dt.getUTCMonth()+1)+"-"+dt.getUTCDate()]; return H?[H.n]:[]; }
const occFor = (id,dt) => id==="il" ? jewish(dt) : usOcc(dt);

function renderOcc(c,now){
  const p={}; fmt[c.id].y.formatToParts(now).forEach(x=>{p[x.type]=x.value});
  const dt=new Date(Date.UTC(+p.year,+p.month-1,+p.day,12)), box=$("#c-"+c.id+" .occ"), D=864e5;
  box.textContent="";
  const add=(t,cls)=>{ const e=document.createElement("span"); e.className="chip "+cls; e.textContent=t; box.appendChild(e); };
  const today=occFor(c.id,dt), base=n=>n.split(" · ")[0];
  today.forEach(n=>add(n,"now"));
  for(let k=1;k<=60;k++){
    const n=occFor(c.id,new Date(dt.getTime()+k*D)).filter(x=>x!=="ראש חודש" && !today.some(t=>base(t)===base(x)));
    if(n.length){ add("הבא: "+n[0]+" · "+(k===1?"מחר":"בעוד "+k+" ימים"),""); break; }
  }
  if(c.id==="il") $("#c-il .hdate").textContent=hebF.format(dt);
}
const nyP = new Intl.DateTimeFormat("en-US",{timeZone:"America/New_York",weekday:"short",year:"numeric",month:"numeric",day:"numeric",hour:"numeric",minute:"numeric",hour12:false,timeZoneName:"short"});
let lastNyse = "";
function updateNyse(now){
  const p={}; nyP.formatToParts(now).forEach(x=>{p[x.type]=x.value});
  const mins=(+p.hour%24)*60 + +p.minute, wd=p.weekday!=="Sat"&&p.weekday!=="Sun";
  const H=usMap(+p.year)[(+p.month)+"-"+(+p.day)];
  const open=wd && !(H&&H.x) && mins>=570 && mins<960;
  const t=(open?"NYSE OPEN":"NYSE CLOSED")+" · "+p.timeZoneName;
  if(t!==lastNyse){ const el=$("#nyse"); el.textContent=t; el.className="nyse "+(open?"on":"off"); lastNyse=t; }
}
let lastDate = {};
function tick(){
  if(document.hidden) return;
  const now = new Date();
  CFG.cities.forEach(c=>{
    const el = $("#c-"+c.id+" .clock");
    const [hm,s] = [fmt[c.id].t.format(now).slice(0,5), fmt[c.id].t.format(now).slice(6)];
    el.innerHTML = hm+"<small>:"+s+"</small>";
    const d = fmt[c.id].d.format(now);
    if(d!==lastDate[c.id]){ $("#c-"+c.id+" .date").textContent = d; lastDate[c.id]=d; renderOcc(c,now); }
  });
  updateNyse(now);
}
tick(); setInterval(tick,1000);

/* ================= מזג אוויר ================= */
const WX = {
  0:["☀️","בהיר"],1:["🌤️","בהיר ברובו"],2:["⛅","מעונן חלקית"],3:["☁️","מעונן"],
  45:["🌫️","ערפל"],48:["🌫️","ערפל"],51:["🌦️","טפטוף"],53:["🌦️","טפטוף"],55:["🌦️","טפטוף"],
  61:["🌧️","גשם קל"],63:["🌧️","גשם"],65:["🌧️","גשם חזק"],66:["🌧️","גשם קפוא"],67:["🌧️","גשם קפוא"],
  71:["🌨️","שלג קל"],73:["🌨️","שלג"],75:["❄️","שלג כבד"],77:["🌨️","גרגרי שלג"],
  80:["🌦️","ממטרים"],81:["🌧️","ממטרים"],82:["⛈️","ממטרים חזקים"],
  85:["🌨️","ממטרי שלג"],86:["🌨️","ממטרי שלג"],95:["⛈️","סופת רעמים"],96:["⛈️","סופת רעמים וברד"],99:["⛈️","סופת רעמים וברד"]
};
const wx = c => WX[c] || ["🌡️","—"];
const dayFmt = new Intl.DateTimeFormat("he-IL",{weekday:"short",timeZone:"UTC"});

async function loadWeather(c){
  const targetUrl = `https://api.open-meteo.com/v1/forecast?latitude=${c.lat}&longitude=${c.lon}&current=temperature_2m,apparent_temperature,weather_code,wind_speed_10m&daily=weather_code,temperature_2m_max,temperature_2m_min,precipitation_probability_max,sunrise,sunset,uv_index_max&timezone=${encodeURIComponent(c.tz)}&forecast_days=5`;
  
  let r = await fetch(targetUrl);
  if(!r.ok) throw new Error("wx " + r.status);
  const j = await r.json();

  const cur = j.current, dl = j.daily, w = wx(cur.weather_code);
  const root = $("#c-"+c.id);
  const windSpeed = cur.wind_speed_10m !== undefined ? cur.wind_speed_10m : (cur.windspeed_10m || 0);

  root.querySelector(".now").innerHTML =
    '<div class="ic">'+w[0]+'</div><div class="t">'+Math.round(cur.temperature_2m)+'°</div>'+
    '<div class="d"><b>'+c.place+'</b> · '+w[1]+'<br>מרגיש '+Math.round(cur.apparent_temperature)+'° · רוח '+Math.round(windSpeed)+' קמ"ש<br>'+
    '🌅 '+dl.sunrise[0].slice(11,16)+' · 🌇 '+dl.sunset[0].slice(11,16)+' · UV '+(dl.uv_index_max ? Math.round(dl.uv_index_max[0]) : '—')+'</div>';
  
  root.querySelector(".days").innerHTML = dl.time.map((d,i)=>
    '<div class="day"><b>'+dayFmt.format(new Date(d+"T00:00:00Z"))+'</b><i>'+wx(dl.weather_code[i])[0]+'</i>'+
    Math.round(dl.temperature_2m_max[i])+'° / '+Math.round(dl.temperature_2m_min[i])+'°<br>💧'+(dl.precipitation_probability_max?.[i]||0)+'%</div>'
  ).join("");
}

function weatherFail(c,e,n){
  const box=$("#c-"+c.id+" .now"), m=document.createElement("div");
  m.className="d"; m.textContent="מזג האוויר בטעינה..."; box.textContent=""; box.appendChild(m);
  if(n<5) setTimeout(()=>loadWeather(c).catch(x=>weatherFail(c,x,n+1)), 5000*(n+1));
}

async function refreshWeather(){
  for(const c of CFG.cities){ 
    try{ await loadWeather(c); }catch(e){ weatherFail(c,e,0); } 
  }
}

/* ================= חדשות מתחלפות (RSS) ================= */
const strip = h => { const d=document.createElement("div"); d.innerHTML=h||""; return (d.textContent||"").replace(/\s+/g," ").trim(); };
const imgIn = h => (/<img[^>]+src="([^"]+)"/.exec(h||"")||[])[1] || "";

async function fetchFeed(f){
  let list = null;
  try{
    const r = await fetch("https://api.rss2json.com/v1/api.json?rss_url="+encodeURIComponent(f.url));
    const j = await r.json();
    if(j.status==="ok") list = j.items.map(i=>({
      title:strip(i.title), desc:strip(i.description).slice(0,320),
      img:i.thumbnail || (i.enclosure&&i.enclosure.link) || imgIn(i.description)
    }));
  }catch(e){}
  if(!list){
    try{
      const r2 = await fetch("https://api.allorigins.win/raw?url="+encodeURIComponent(f.url));
      if(r2.ok){
        const xml = new DOMParser().parseFromString(await r2.text(),"text/xml");
        list = [...xml.querySelectorAll("item")].map(i=>{
          const dsc = i.querySelector("description")?.textContent||"";
          return {title:strip(i.querySelector("title")?.textContent), desc:strip(dsc).slice(0,320),
            img:imgIn(dsc)||i.querySelector("enclosure")?.getAttribute("url")||""};
        });
      }
    }catch(e){}
  }
  return list ? list.map(i=>({...i,src:f.name})) : [];
}

function interleave(arrs){
  const out=[]; for(let i=0;;i++){ let any=false; arrs.forEach(a=>{ if(a[i]){out.push(a[i]);any=true;} }); if(!any) break; }
  return out;
}

function makeRotator(sel, feeds, sec, max){
  const root=$(sel), q=s=>root.querySelector(s);
  let items=[], idx=0, timer=null;
  function show(){
    if(!items.length) return;
    const it=items[idx], body=q(".nbody"), bar=q(".bar"), img=q(".nimg");
    body.classList.add("out");
    setTimeout(()=>{
      q(".ntitle").textContent=it.title; q(".ndesc").textContent=it.desc;
      q(".nsrc").textContent=it.src; q(".ncount").textContent=(idx+1)+" / "+items.length;
      if(it.img){ img.src=it.img; img.hidden=false; img.onerror=()=>{img.hidden=true}; } else img.hidden=true;
      body.classList.remove("out");
      bar.classList.remove("run"); void bar.offsetWidth;
      bar.style.setProperty("--dur",sec+"s"); bar.classList.add("run");
    },600);
  }
  async function refresh(){
    const res = await Promise.allSettled(feeds.map(fetchFeed));
    const all = interleave(res.filter(r=>r.status==="fulfilled" && Array.isArray(r.value)).map(r=>r.value.filter(x=>x.title))).slice(0,max);
    if(all.length){
      items=all; if(idx>=items.length) idx=0;
      if(!timer){ show(); timer=setInterval(()=>{ if(document.hidden||!items.length) return; idx=(idx+1)%items.length; show(); }, sec*1000); }
      setStatus("עודכן "+new Date().toLocaleTimeString("he-IL",{hour:"2-digit",minute:"2-digit"}));
    } else setStatus("חדשות: אין חיבור, ינסה שוב");
  }
  return {refresh};
}

const rotators = [ makeRotator("#news",CFG.newsFeeds,CFG.newsRotateSec,20), makeRotator("#tvnews",CFG.topFeeds,CFG.topRotateSec,24) ];
const refreshNews = () => rotators.forEach(r=>r.refresh());

function loadEmbed(boxId, file, config, delay){
  setTimeout(()=>{
    const box=$("#"+boxId); if(!box) return; box.textContent="";
    const w=document.createElement("div"); w.className="tradingview-widget-container"; w.style.cssText="width:100%;height:100%";
    const i=document.createElement("div"); i.className="tradingview-widget-container__widget"; i.style.cssText="width:100%;height:100%";
    const sc=document.createElement("script"); sc.async=true;
    sc.src="https://s3.tradingview.com/external-embedding/embed-widget-"+file+".js";
    sc.text=JSON.stringify(config);
    w.appendChild(i); w.appendChild(sc); box.appendChild(w);
  },delay);
}

// Render Custom Assets Banner Grid using TradingView Mini Symbol Overview / Single Quotes widgets or clean fallback loader
function renderCustomAssetsBanner(){
  const grid = $("#assetGrid");
  if(!grid) return;
  grid.innerHTML = "";

  CFG.customAssets.forEach(asset => {
    const card = document.createElement("div");
    card.className = "asset-card";
    
    // Container for the mini widget embed
    const widgetId = "tv-mini-" + asset.symbol.toLowerCase().replace(/[^a-z0-9]/g, "");
    
    card.innerHTML = `
      <div class="asset-symbol">${asset.symbol}</div>
      <div class="tvbox" id="${widgetId}" style="width:100%;height:54px;margin-top:auto;"></div>
    `;
    grid.appendChild(card);

    // Embed TradingView Single Quote / Mini Chart widget for live price and change
    setTimeout(()=>{
      const container = $("#"+widgetId);
      if(!container) return;
      const w = document.createElement("div");
      w.className = "tradingview-widget-container";
      w.style.cssText = "width:100%;height:100%";
      const sc = document.createElement("script");
      sc.async = true;
      sc.src = "https://s3.tradingview.com/external-embedding/embed-widget-single-quote.js";
      sc.text = JSON.stringify({
        symbol: asset.proName,
        width: "100%",
        height: "100%",
        colorTheme: "dark",
        isTransparent: true,
        locale: "en"
      });
      w.appendChild(sc);
      container.appendChild(w);
    }, 300);
  });
}
